<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyCampus</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="toast-container"></div>

    <header class="app-header global-element" id="main-nav">
        <div class="logo" data-action="nav" data-target="landing">
            <span class="logo-icon">📘</span> StudyCampus
        </div>
        <div class="nav-actions">
            <span id="user-profile-tag" class="hidden"></span>
            <button id="auth-action-btn" class="btn-text" data-action="auth-toggle">로그인</button>
        </div>
    </header>

    <main class="global-element" style="flex:1;">
        <section id="view-landing" class="view">
            <div class="blue-gradient-hero">
                <p class="subtitle">ENGLISH LIBERATION FORMULA</p>
                <h1>자기주도학습으로<br>완성되는<br>온라인 스터디</h1>
                <p class="desc">담임 선생님 1:1 관리 · 매주 피드백</p>
                <div class="stats-row">
                    <div><strong>10명</strong><br><span>돌파 수강</span></div>
                    <div><strong>-등급</strong><br><span>평균 상승</span></div>
                    <div><strong>-점</strong><br><span> -등급</span></div>
                </div>
                <div class="btn-group">
                    <button class="btn-white" data-action="nav" data-target="auth">무료 상담 신청</button>
                    <button class="btn-white-outline" data-action="nav" data-target="auth">입학 테스트</button>
                </div>
            </div>
            <div class="feature-boxes">
                <div class="f-box"><strong>왜 스터디캠퍼스?</strong><p>완벽한 자기주도학습</p></div>
                <div class="f-box"><strong>노력으로 인한 결과</strong><p>1등급의 비결</p></div>
            </div>
        </section>

        <section id="view-auth" class="view hidden auth-container">
            <div class="auth-card">
                <h2 style="margin-bottom:20px;">StudyCampus 시작하기</h2>
                <div class="auth-tabs">
                    <button id="tab-login" class="active" data-auth-mode="login">로그인</button>
                    <button id="tab-register" data-auth-mode="register">회원가입</button>
                </div>
                <form id="auth-form">
                    <input type="text" id="auth-id" class="input-field" required placeholder="아이디">
                    <input type="password" id="auth-pw" class="input-field" required placeholder="비밀번호">
                    <input type="text" id="auth-name" class="input-field hidden" placeholder="이름">
                    <button type="submit" class="btn-primary" id="auth-submit-btn">로그인</button>
                </form>
            </div>
        </section>
    </main>

    <section id="view-student" class="view hidden app-wrapper">
        <header class="app-header">
            <div class="logo">StudyCampus</div>
            <div class="nav-actions"><button class="btn-text" data-action="auth-toggle">로그아웃</button></div>
        </header>
        <div class="app-body" id="student-dash-content"></div>
    </section>

    <section id="view-admin" class="view hidden app-wrapper">
        <header class="app-header">
            <div class="logo">Admin Center</div>
            <div class="nav-actions"><button class="btn-text" data-action="auth-toggle">로그아웃</button></div>
        </header>
        <div class="app-sidebar-layout">
            <aside class="sidebar" id="admin-sidebar">
                <ul>
                    <li data-tab="users" class="active">👥 학생/수강권 관리</li>
                    <li data-tab="homework">📝 숙제 배포/검사</li>
                    <li data-tab="lectures">📖 강의/진도 관리</li>
                </ul>
            </aside>
            <main class="admin-content" id="admin-dash-content"></main>
        </div>
    </section>

    <footer class="app-footer global-element">
        <p>&copy; 2026 StudyCampus. All rights reserved.</p>
    </footer>
    
    <script type="module" src="script.js"></script>
</body>
</html>
